[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadet-rl"
version = "0.1.0"
description = "Cloud-Aware Dynamic Earth-observation Tasking: energy-aware dynamic tasking for agile Earth-observing satellites with deep reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "reinforcement-learning",
    "earth-observation",
    "satellite-scheduling",
    "constrained-mdp",
    "remote-sensing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
logging = ["tensorboard>=2.14", "tqdm>=4.66", "rich>=13.0"]

[project.scripts]
cadet-train = "cadet.train:main"
cadet-evaluate = "cadet.evaluate:main"
cadet-sweep = "cadet.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
